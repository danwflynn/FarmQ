name: FarmQ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install dependencies
        run: go mod download

      - name: Run linter
        run: |
          go install golang.org/x/lint/golint@latest
          golint ./...

      - name: Run unit tests
        run: go test ./... -v

      - name: Build API Docker image
        run: |
          docker build \
            --build-arg SERVICE=api \
            -t farmq-api:ci \
            -f Dockerfile .

      - name: Build Worker Docker image
        run: |
          docker build \
            --build-arg SERVICE=worker \
            -t farmq-worker:ci \
            -f Dockerfile .

      - name: Start full stack
        run: docker compose up -d --build

      - name: Wait for API to be ready
        run: |
          for i in {1..15}; do
            curl -f http://localhost:8080/health && break
            echo "Waiting for API..."
            sleep 2
          done

      - name: Run E2E tests
        run: go test -tags=e2e ./e2e -v

      - name: Shutdown services
        if: always()
        run: docker compose down --volumes
